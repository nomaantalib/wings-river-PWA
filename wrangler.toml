name = "wings-river-pwa"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "out"
assets = { directory = "out" }

# ── Cloudflare D1 Database ──────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "wings_river_cafe_reservations"
database_id = "912b607b-c192-4e0a-89ba-75f936fca45c"

# ── Cloudflare Durable Objects ────────────────────────────────────────────────
[durable_objects]
bindings = [
  { name = "TABLE_SESSION", class_name = "TableSessionDO" },
  { name = "ORDER_NOTIFIER", class_name = "OrderNotifierDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["TableSessionDO", "OrderNotifierDO"]

