<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F131C"/>
      <stop offset="50%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D0"/>
      <stop offset="35%" stop-color="#F5D061"/>
      <stop offset="70%" stop-color="#E5B82C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- PWA Base Icon Canvas with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring with Gold Gradient & Glow -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="5" filter="url(#goldGlow)"/>

  <!-- Padded Inner Logo Badge (Generous ~72px padding on all sides to prevent Android/Desktop clipping) -->
  <g transform="translate(256, 256)">
    <!-- Inner Background Disc -->
    <circle cx="0" cy="0" r="175" fill="#0B0E14" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Padded Embedded Cafe Logo Image -->
    <image href="/logo.png" x="-155" y="-155" width="310" height="310" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
