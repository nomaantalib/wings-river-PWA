<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="round-clip">
      <rect x="0" y="0" width="512" height="512" rx="102.4" ry="102.4" />
    </clipPath>
  </defs>
  <!-- Render the logo inside a 20% border-radius clip path -->
  <g clip-path="url(#round-clip)">
    <image href="/logo.png" x="0" y="0" width="512" height="512" />
  </g>
</svg>
